<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Paintart Clock</title>
<meta name="description" content="A digital clock on a rotating wall of public-domain paintings, served straight from GitHub Pages.">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0a08">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' rx='3' fill='%230b0a08'/><circle cx='8' cy='8' r='4.5' fill='none' stroke='%23e7d9b8'/><path d='M8 5v3l2 1.4' stroke='%23e7d9b8' fill='none' stroke-linecap='round'/></svg>">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!--
  Every mood typeface in lib/mood.js, subset to the glyphs a clock actually draws.
  `text=` cuts each family to a couple of kilobytes, so loading all six costs less than
  loading one full face and the switch between artworks is instant.
-->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:wght@500&family=Cinzel:wght@600&family=Cormorant+Garamond:wght@500&family=Noto+Serif+JP:wght@500&family=Playfair+Display:wght@500&family=Space+Grotesk:wght@500&text=0123456789%3A&display=swap">
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<div id="app" data-size="display" data-image-state="loading">
  <img id="artwork" class="artwork" alt="" decoding="async" fetchpriority="high">
  <div class="scrim" aria-hidden="true"></div>

  <main class="stage">
    <time id="clock" class="clock" aria-live="off">
      <span class="clock__face" aria-hidden="true">
        <span class="digit" data-slot="0"><span class="digit__cur">0</span><span class="digit__next">0</span></span>
        <span class="digit" data-slot="1"><span class="digit__cur">0</span><span class="digit__next">0</span></span>
        <span class="clock__colon" id="colon">:</span>
        <span class="digit" data-slot="2"><span class="digit__cur">0</span><span class="digit__next">0</span></span>
        <span class="digit" data-slot="3"><span class="digit__cur">0</span><span class="digit__next">0</span></span>
        <span class="clock__seconds" id="seconds">00</span>
      </span>
    </time>
  </main>

  <footer class="plate">
    <div class="credit">
      <p class="credit__title" id="art-title">Loading the gallery…</p>
      <p class="credit__meta" id="art-meta"></p>
      <p class="credit__line">
        <a class="credit__source" id="art-source" href="#" rel="noopener noreferrer" target="_blank">Source</a>
        <span class="credit__dot" aria-hidden="true">·</span>
        <span id="mood-name"></span>
        <span class="credit__dot" aria-hidden="true">·</span>
        <span id="next-change"></span>
      </p>
    </div>

    <div class="controls" role="group" aria-label="Clock controls">
      <button class="control" id="btn-smaller" type="button" title="Smaller clock (−)">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/></svg>
        <span class="visually-hidden">Make the clock smaller</span>
      </button>
      <button class="control" id="btn-larger" type="button" title="Larger clock (+)">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        <span class="visually-hidden">Make the clock larger</span>
      </button>
      <button class="control" id="btn-seed" type="button" title="New artwork sequence (R)">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0-.6 4"/><path d="M20 4v7h-7"/></svg>
        <span class="visually-hidden">Shuffle to a new artwork sequence</span>
      </button>
      <button class="control" id="btn-fullscreen" type="button" aria-pressed="false" title="Fullscreen (F)">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
        <span class="visually-hidden">Toggle fullscreen</span>
      </button>
    </div>
  </footer>

  <p id="status" class="visually-hidden" role="status" aria-live="polite"></p>
</div>
<script type="module" src="./app.js"></script>
</body>
</html>
