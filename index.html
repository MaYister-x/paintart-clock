<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#11100f">
    <meta name="description" content="A deterministic digital clock framed by public-domain masterpieces.">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <title>Paintart Clock</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2311100f'/%3E%3Cpath d='M16 6 26 16 16 26 6 16Z' fill='none' stroke='%23fff' stroke-width='1.5'/%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,600&family=Cinzel:wght@400;500&family=Cormorant+Garamond:wght@400;500&family=DM+Mono:wght@300;400&display=swap">
    <link rel="stylesheet" href="./styles.css">
    <script type="module" src="./app.js"></script>
  </head>
  <body>
    <main id="app" class="app" data-size="display" data-image-state="loading">
      <img id="artwork-image" class="artwork" alt="" fetchpriority="high">
      <div class="ambient" aria-hidden="true"></div>
      <div class="vignette" aria-hidden="true"></div>

      <header class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <h1>Paintart Clock</h1>
      </header>

      <section class="clock-stage" aria-label="Current time">
        <time id="clock" class="clock">
          <span class="minute-viewport" aria-hidden="true">
            <span id="hour-minute" class="hour-minute">00:00</span>
            <span id="hour-minute-incoming" class="hour-minute incoming">00:00</span>
          </span>
          <span class="sr-only">Current time</span>
          <span id="second" class="second" aria-hidden="true">00</span>
        </time>
        <p id="rotation-status" class="rotation-status">Preparing the next artwork…</p>
      </section>

      <aside class="artwork-info" aria-live="polite">
        <p class="eyebrow">Public domain collection</p>
        <h2 id="artwork-title">Loading artwork…</h2>
        <p id="artwork-byline" class="byline"></p>
        <p class="source-line">
          <a id="artwork-source" href="https://www.metmuseum.org/art/collection" target="_blank" rel="noreferrer">The Metropolitan Museum of Art</a>
          <span aria-hidden="true">·</span>
          <span>Clock face: <span id="font-name">—</span></span>
        </p>
      </aside>

      <nav class="controls" aria-label="Clock controls">
        <button id="smaller-button" type="button" title="Smaller clock (−)" aria-label="Make the clock smaller">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/></svg>
          <span class="button-label">Size</span>
        </button>
        <button id="larger-button" type="button" title="Larger clock (+)" aria-label="Make the clock larger">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
          <span class="button-label">Size</span>
        </button>
        <span class="control-divider" aria-hidden="true"></span>
        <button id="refresh-button" type="button" title="Refresh artwork sequence (R)" aria-label="Create a new artwork sequence">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.34 5.66M20 5v6h-6"/></svg>
          <span class="button-label">Shuffle</span>
        </button>
        <button id="fullscreen-button" type="button" title="Enter fullscreen (F)" aria-label="Toggle fullscreen" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H3v5M16 3h5v5M8 21H3v-5M16 21h5v-5"/></svg>
          <span class="button-label">Full</span>
        </button>
      </nav>

      <p id="status" class="sr-only" role="status" aria-live="polite"></p>
      <noscript>This clock requires JavaScript to update the time and artwork.</noscript>
    </main>
  </body>
</html>
